<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de tareas con HTML, CSS y JavaScript; guarda los datos en el navegador.">
  <title>Lista de tareas — Odalys Rendón Peláez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/estilos.css">
  <link rel="stylesheet" href="estilo.css">
  <script src="../../js/tema.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>
  <a class="volver" href="../../index.html#proyectos">← Volver al portafolio</a>
  <main id="main" class="contenedor">
    <h1>Lista de tareas</h1>
    <form id="form-tarea" class="nueva">
      <label for="texto">Nueva tarea</label>
      <div class="nueva__fila">
        <input id="texto" type="text" autocomplete="off" required>
        <button class="btn btn--primario" type="submit">Agregar</button>
      </div>
    </form>
    <p id="resumen" role="status" aria-live="polite"></p>
    <ul id="lista" class="tareas" aria-label="Tareas"></ul>
    <p id="vacio" class="vacio" hidden>Aún no tienes tareas. Escribe una arriba y presiona Agregar.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
